name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-all-formats:
    name: Python ${{ matrix.python }} / ${{ matrix.os }} / optional formats
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test and optional format dependencies
        run: python -m pip install -e ".[dev,formats]"
      - name: Run complete Python suite
        run: python -m pytest

  python-minimal:
    name: Python 3.10 / minimal dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install without optional native codecs
        run: python -m pip install -e ".[dev]"
      - name: Exercise dependency-free core formats
        run: >-
          python -m pytest
          tests/test_polynomial_hash.py
          tests/test_lz77.py
          tests/test_deflate_parser.py
          tests/test_gzip_parser.py

  python-quality:
    name: Python lint / types / coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality and optional format dependencies
        run: python -m pip install -e ".[dev,formats]"
      - name: Ruff
        run: python -m ruff check uhc tests tools
      - name: Mypy
        run: python -m mypy uhc
      - name: Coverage gate
        run: >-
          python -m pytest
          --ignore=tests/test_cross_format.py
          --cov=uhc
          --cov-fail-under=84
          --cov-report=term-missing:skip-covered
          --cov-report=xml

  python-package:
    name: Python wheel and sdist contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package tooling
        run: python -m pip install ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate metadata and artifact boundaries
        run: |
          python -m twine check dist/*
          python tools/check_package_contents.py --wheel dist/*.whl --sdist dist/*.tar.gz

  rust-tests:
    name: Rust stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test every declared target and feature
        run: cargo test --locked --all-targets --all-features

  rust-quality:
    name: Rust fmt / clippy / docs / crate contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Build and inspect the unpublished crate
        run: |
          cargo package --locked
          python tools/check_package_contents.py --crate target/package/cdh-sort-*.crate

  rust-fuzz-targets:
    name: Rust fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Compile checked-in fuzz binaries without running a campaign
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
