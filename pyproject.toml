[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhc"
version = "0.2.0rc1"
description = "Exact cross-format byte verification with experimental compression parsers"
readme = "README.python.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "UHC Contributors"},
]
keywords = [
    "compression",
    "hashing",
    "lz77",
    "deduplication",
    "integrity",
    "polynomial-hash",
    "deflate",
    "zstandard",
    "lz4",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = []

[project.scripts]
uhc = "uhc.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=5.1",
]
formats = [
    "lz4>=4.0",
    "zstandard>=0.22",
    "blake3>=1.0",
]

[project.urls]
Homepage = "https://github.com/jemsbhai/uhc"
Documentation = "https://github.com/jemsbhai/uhc"
Repository = "https://github.com/jemsbhai/uhc"
Issues = "https://github.com/jemsbhai/uhc/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["uhc", "uhc.*"]
exclude = ["tests", "tests.*", "src", "src.*", "benches", "benches.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["uhc"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["uhc"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The mathematical notation in these APIs intentionally uses `l` for length;
# renaming public keyword parameters would be a compatibility break.
"uhc/core/compressed_verifier.py" = ["E741"]
"uhc/core/lz77.py" = ["E741"]
"uhc/core/multihash.py" = ["E741"]
"uhc/core/polynomial_hash.py" = ["E741"]
# Legacy tests retain late imports and theorem-style one-letter variables.
# CI still checks them for syntax/import failures and all other selected rules.
"tests/**/*.py" = ["E402", "E741", "F401", "F841"]
